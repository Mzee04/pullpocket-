[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
ffi = false
fs_permissions = [{ access = "read-write", path = "./" }]

[rpc_endpoints]
arc_testnet = "https://rpc.testnet.arc.io"
arc_mainnet = "https://rpc.mainnet.arc.io"

[etherscan]
# Block explorers: https://explorer.testnet.arc.io / https://explorer.arc.io
